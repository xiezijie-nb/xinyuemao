<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>月薪喵 - 我真的特别爱你</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    min-height: 100vh;
    background: linear-gradient(135deg, #ffd1dc 0%, #ffe4e1 50%, #ffecec 100%);
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }
  
  .container {
    background: rgba(255, 255, 255, 0.85);
    border-radius: 30px;
    padding: 40px 30px;
    box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3),
                0 0 0 3px rgba(255, 182, 193, 0.5);
    text-align: center;
    max-width: 500px;
    width: 100%;
    animation: fadeIn 0.8s ease-out;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  
  .title {
    font-size: 28px;
    font-weight: bold;
    color: #ff1493;
    margin-bottom: 25px;
    text-shadow: 2px 2px 4px rgba(255, 105, 180, 0.2);
    letter-spacing: 2px;
  }
  
  .cat-box {
    background: linear-gradient(135deg, #fff0f5 0%, #ffe4ec 100%);
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 25px;
    border: 3px dashed #ffb6c1;
    box-shadow: inset 0 2px 10px rgba(255, 182, 193, 0.2);
  }
  
  .cat-img {
    max-width: 100%;
    width: 280px;
    height: auto;
    display: block;
    margin: 0 auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    animation: bounce 2s ease-in-out infinite;
  }
  
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  
  .love-text {
    font-size: 26px;
    font-weight: bold;
    color: #ff69b4;
    margin-top: 10px;
    text-shadow: 2px 2px 4px rgba(255, 105, 180, 0.3);
    letter-spacing: 3px;
    animation: pulse 1.5s ease-in-out infinite;
  }
  
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.9; }
  }
  
  .music-box {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  
  .music-btn {
    background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
    color: white;
    border: none;
    padding: 12px 35px;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(255, 20, 147, 0.4);
    transition: all 0.3s ease;
    letter-spacing: 2px;
  }
  
  .music-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(255, 20, 147, 0.6);
  }
  
  .music-btn:active {
    transform: translateY(0);
  }
  
  .music-btn.playing {
    background: linear-gradient(135deg, #9370db 0%, #8a2be2 100%);
    box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
  }
  
  .music-icon {
    display: inline-block;
    margin-right: 8px;
    font-size: 18px;
  }
  
  .music-icon.spinning {
    animation: spin 1.5s linear infinite;
    display: inline-block;
  }
  
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  
  .tip {
    font-size: 13px;
    color: #999;
    margin-top: 8px;
  }
  
  .hearts {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
    z-index: 100;
  }
  
  .heart {
    position: absolute;
    font-size: 24px;
    animation: floatUp 3s ease-out forwards;
    opacity: 0;
  }
  
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(0) scale(0.5); }
    15% { opacity: 1; transform: translateY(-20px) scale(1); }
    100% { opacity: 0; transform: translateY(-300px) scale(0.8) rotate(25deg); }
  }
  
  @media (max-width: 480px) {
    .title { font-size: 22px; }
    .love-text { font-size: 20px; }
    .cat-img { width: 220px; }
    .container { padding: 30px 20px; }
  }
</style>
</head>
<body>

<div class="hearts" id="heartsContainer"></div>

<div class="container">
  <div class="title">🐾 月薪喵 🐾</div>
  
  <div class="cat-box">
    <img class="cat-img" id="catImg" src="cat.GIF" alt="月薪喵"
         onerror="this.onerror=null;this.src='cat.gif';"
         style="background:#fff;border-radius:15px;">
    <div class="love-text">我真的特别爱你 💕</div>
  </div>
  
  <div class="music-box">
    <button class="music-btn" id="musicBtn" onclick="toggleMusic()">
      <span class="music-icon" id="musicIcon">🎵</span>
      <span id="musicLabel">播放背景音乐</span>
    </button>
    <div class="tip">点击按钮播放音乐 · 点击页面任意处飘心 ♥</div>
  </div>
</div>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
  const audio = document.getElementById('bgMusic');
  const btn = document.getElementById('musicBtn');
  const label = document.getElementById('musicLabel');
  const icon = document.getElementById('musicIcon');
  let isPlaying = false;
  
  function toggleMusic() {
    if (isPlaying) {
      audio.pause();
      btn.classList.remove('playing');
      icon.classList.remove('spinning');
      label.textContent = '播放背景音乐';
      isPlaying = false;
    } else {
      audio.play().then(() => {
        btn.classList.add('playing');
        icon.classList.add('spinning');
        label.textContent = '暂停音乐';
        isPlaying = true;
      }).catch(err => {
        alert('播放失败：' + err.message + '\n请确认 music.mp3 文件存在');
      });
    }
  }
  
  // 点击页面飘心
  document.addEventListener('click', function(e) {
    if (e.target.closest('.music-btn')) return;
    createHeart(e.clientX, e.clientY);
  });
  
  function createHeart(x, y) {
    const hearts = ['❤️', '💕', '💖', '💗', '💝', '💘', '🌸', '✨'];
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    heart.style.left = x + 'px';
    heart.style.top = y + 'px';
    document.getElementById('heartsContainer').appendChild(heart);
    setTimeout(() => heart.remove(), 3000);
  }
  
  // 自动飘心
  setInterval(() => {
    const x = Math.random() * window.innerWidth;
    const y = window.innerHeight - 50;
    createHeart(x, y);
  }, 800);
</script>

</body>
</html>
